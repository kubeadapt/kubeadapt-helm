to: "1.0.1"
from: "0\\.17\\..*|0\\.18\\..*"
name: Pre-Major-Rebrand-Manual-Upgrade-Required
url: https://github.com/kubeadapt/kubeadapt-helm/releases/tag/kubeadapt-1.0.0
message: |
  1.0.1 is a 1.x release. Moving to it from 0.17.x or 0.18.x crosses the v1.0.0
  breaking changes, which cannot be applied automatically:
    - Image registry alias migrated.
    - Image binaries renamed (kubeadapt-agent → kubeadapt-k8s-agent, kubeadapt-upgrader → kubeadapt-k8s-upgrader).
    - Subchart renamed: ebpf-agent → kubeadapt-k8s-pulse. If you override subchart values under 'ebpf-agent:' in your values.yaml, rename it to 'kubeadapt-k8s-pulse:' before upgrading; otherwise the overrides will be silently ignored.

  Customer action required:
    1. Read the release notes: https://github.com/kubeadapt/kubeadapt-helm/releases/tag/kubeadapt-1.0.0
    2. Save the values of your release, including those you passed with --set:
       'helm get values kubeadapt --namespace kubeadapt -o yaml > values.yaml'
       Check that values.yaml has agent.config.token or agent.config.existingSecret, and rename 'ebpf-agent:' to 'kubeadapt-k8s-pulse:' if it is there.
    3. Run 'helm repo update', then 'helm upgrade kubeadapt kubeadapt/kubeadapt --namespace kubeadapt --version 1.0.1 --reset-values -f values.yaml' manually.
       Helm then uses only values.yaml and the chart defaults. If you installed under another release name or namespace, use those in both commands.

matchingRules:
  - type: Always
