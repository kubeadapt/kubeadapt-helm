{{- /*
`helm upgrade --reuse-values` renders this chart with the values of the
release being upgraded: the old chart's defaults, image tags included, and
nothing from this values.yaml. With the network monitor off that still works,
and the release keeps running what it ran. Turning the network monitor on
cannot work that way: the agent image, the monitor's tolerations and its
connection to the agent would all stay as the old release had them. So that
combination is refused with the way out. global.pulse is the marker: every
values.yaml that can connect the two has it.
*/}}
{{- $pulse := index .Values "kubeadapt-k8s-pulse" | default dict }}
{{- if and $pulse.enabled (not (hasKey .Values.global "pulse")) }}
{{- fail "kubeadapt-k8s-pulse.enabled is set, but these values were written for an earlier chart release (helm upgrade --reuse-values keeps the previous release's defaults, image tags included). The network monitor needs the images and settings of this release. Upgrade with --reset-values -f <your complete values file>, or with --reset-then-reuse-values (Helm 3.14 or newer), which keeps your own overrides and takes everything else from this chart." }}
{{- end }}
