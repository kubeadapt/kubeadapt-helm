{{- if and (include "kubeadapt.pulse.enabled" .) (not .Values.global.pulseChannel.existingSecret) }}
# Bearer token of the pulse -> agent flow channel. The agent reads it from an
# env var and rejects any push without it; pulse mounts it as a file. The
# channel is plaintext gRPC, so the token travels unencrypted inside the
# cluster network. Reused across upgrades; delete this Secret and run
# `helm upgrade` to rotate it, then restart the pulse DaemonSet (the agent
# restarts on its own).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadapt.pulseChannel.secretName" . }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
data:
  token: {{ include "kubeadapt.pulseChannel.token" . }}
{{- end }}
