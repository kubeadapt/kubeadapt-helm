{{- if and (include "kubeadapt.pulseConnected" .) (not (.Values.global.pulse | default dict).existingSecret) }}
{{- $name := include "kubeadapt.pulseTokenSecretName" . }}
{{- /* Reuse the token already in the cluster so an upgrade does not rotate it. Without cluster access (helm template) lookup returns nothing and a new token is generated. */}}
{{- $token := randAlphaNum 48 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- with index $existing.data "token" }}
{{- $token = . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
data:
  token: {{ $token | quote }}
{{- end }}
