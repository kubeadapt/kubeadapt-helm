{{- if .Values.agent.enabled }}
{{- if .Values.agent.autoUpgrade.enabled }}
{{- if .Values.agent.autoUpgrade.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeadapt.name" . }}-upgrader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
  {{- with .Values.agent.autoUpgrade.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.agent.autoUpgrade.rbac.create }}
# The upgrader SIDECAR's permissions. It runs in the agent pod, and a pod has
# one service account, so this Role is bound to the agent's account - which
# is why it exists only while auto-upgrade is on. The Helm upgrade itself runs
# in a Job under the separate upgrader account below.
#
# Each rule matches a call in kubeadapt-k8s-upgrader:
#   jobs create/get          create the upgrade Job, then poll it
#   configmaps get/create/update/delete
#                            the upgrade lock ConfigMap
#   secrets get/list         Helm release history (rollback detection); Helm
#                            stores releases as Secrets
#   pods/log get             the Job's log when an upgrade fails
# Listing its own pod and the Job's pods uses the agent ClusterRole's pods list.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeadapt.name" . }}-upgrader-sidecar
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
rules:
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "create"]

  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "create", "update", "delete"]

  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeadapt.name" . }}-upgrader-sidecar
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeadapt.name" . }}-upgrader-sidecar
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeadapt.name" . }}-agent
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeadapt.name" . }}-upgrader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
rules:
  # Helm release management
  # Helm stores release metadata in Secrets (default) or ConfigMaps
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "create", "update", "patch", "delete"]
    # Helm secrets follow pattern: sh.helm.release.v1.<release-name>.v<version>

  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "create", "update", "patch", "delete"]
    # ConfigMaps used if Helm storage backend is configmap

  # Manage all KubeAdapt resources during upgrade
  - apiGroups: [""]
    resources:
      - services
      - serviceaccounts
    verbs: ["get", "list", "create", "update", "patch", "delete"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "create", "update", "patch", "delete", "escalate"]

  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Pods and events for debugging upgrade failures
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list"]

  # NetworkPolicies (if enabled)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "create", "update", "patch", "delete"]

  # PodDisruptionBudgets (if enabled)
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeadapt.name" . }}-upgrader{{ include "kubeadapt.clusterResourceSuffix" . }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
rules:
  # ClusterRole and ClusterRoleBinding management for KubeAdapt resources
  # Note: resourceNames only works for get/list/update/patch/delete, not create
  # Create is needed when upgrading to versions that add new cluster-scoped RBAC
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    resourceNames:
      - "{{ include "kubeadapt.name" . }}-agent{{ include "kubeadapt.clusterResourceSuffix" . }}"
      - "{{ include "kubeadapt.name" . }}-upgrader{{ include "kubeadapt.clusterResourceSuffix" . }}"
    verbs: ["get", "list", "update", "patch", "delete", "escalate"]
  # Separate rule for create (resourceNames constraint not supported)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs: ["create", "escalate"]
  # Every permission the agent ClusterRole grants. Writing a ClusterRole, or
  # binding one, requires holding its permissions; the list is the agent's
  # own, so the two cannot drift.
  {{- include "kubeadapt.agent.clusterRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeadapt.name" . }}-upgrader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeadapt.name" . }}-upgrader
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeadapt.name" . }}-upgrader
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeadapt.name" . }}-upgrader{{ include "kubeadapt.clusterResourceSuffix" . }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeadapt.name" . }}-upgrader{{ include "kubeadapt.clusterResourceSuffix" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeadapt.name" . }}-upgrader
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
