{{- if and .Values.agent.enabled (not .Values.agent.config.existingSecret) }}
{{- /*
An empty token would be written to the Secret and the agent would start,
be refused by Kubeadapt and report nothing. It happens when an upgrade resets
the values (--reset-values) and the file passed with it names no token.
*/}}
{{- if not (.Values.agent.config.token | toString | trim) }}
{{- fail "The agent has no token. Set agent.config.existingSecret to the name of a Secret that holds the token under the key \"token\" (recommended), or set agent.config.token. On an upgrade that resets the values (--reset-values), the values file has to name one of them again." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadapt.name" . }}-agent
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
data:
  token: {{ .Values.agent.config.token | b64enc | quote }}
{{- end }}
