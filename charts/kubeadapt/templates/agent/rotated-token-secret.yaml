{{- if .Values.agent.enabled }}
{{- $name := include "kubeadapt.agentRotatedTokenSecretName" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
# Where the agent stores the token it rotated to. The agent writes it. The
# chart creates it empty and on every upgrade renders back what is live, so
# neither a manual upgrade nor an auto-upgrade replaces the agent's token.
# helm uninstall deletes it, so a new install starts empty. Without cluster
# access (helm template) lookup finds nothing and it renders empty.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
{{- with (and $live $live.data) }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
