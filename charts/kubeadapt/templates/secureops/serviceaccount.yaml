{{- if include "kubeadapt.secureops.enabled" . }}
{{- $id := .Values.secureops.scanner.cloudIdentity }}
{{- $annotations := dict }}
{{- with $id.aws.roleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" (toString .) }}
{{- end }}
{{- with $id.gcp.serviceAccount }}
{{- $_ := set $annotations "iam.gke.io/gcp-service-account" (toString .) }}
{{- end }}
{{- with $id.azure.clientId }}
{{- $_ := set $annotations "azure.workload.identity/client-id" (toString .) }}
{{- end }}
# The identity scan Jobs run as. It carries no Kubernetes API token and no
# permissions: nothing binds a Role to it. A scan Job takes the agent pod's
# pull secrets; only when the agent pod has none does Kubernetes add this
# account's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeadapt.secureops.scannerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeadapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: secureops-scanner
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "kubeadapt.imagePullSecrets" . }}
automountServiceAccountToken: false
{{- end }}
