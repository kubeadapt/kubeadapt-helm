apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.1.0
# The agent release this chart deploys (agent.image.tag). Keep in step with
# that tag; it is also the image tag used when agent.image.tag is empty.
appVersion: "v3.2.0"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.1.0"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: changed
      description: "Deploys agent v3.2.0 and the network monitor chart kubeadapt-k8s-pulse 1.1.0 with network monitor v3.2.0. Earlier network monitor images replace the classic tc filter at priority 1, handle 1 on each pod's network interface; the chart refuses image tags older than v3.2.0."
    - kind: added
      description: "With kubeadapt-k8s-pulse.enabled, the network monitor sends its traffic records to the agent. The agent's listener runs behind the <name>-agent-pulse ClusterIP Service, and both sides read the same token from a Secret the chart creates once and keeps across upgrades, or from global.pulse.existingSecret."
    - kind: added
      description: "The agent may list and watch EndpointSlices, which agent v3.2.0 reads to name addresses no pod or node has, such as the API server's. Without the rule it runs with partial data."
    - kind: changed
      description: "The upgrader holds every rule of the network monitor's ClusterRole, and may manage its ResourceQuota and PriorityClass when the chart creates them, so auto-upgrades with the network monitor enabled can update its binding."
    - kind: added
      description: "global.imagePullSecrets for the agent, the network monitor and the upgrade Job, agent.podAnnotations and agent.podLabels, and an optional NetworkPolicy (agent.networkPolicy) that admits the network monitor to the agent in a namespace that denies ingress by default."
    - kind: changed
      description: "The chart stops rendering without an agent token, and when the network monitor is turned on with values written for an earlier release (helm upgrade --reuse-values). Auto-upgrade uses --reset-then-reuse-values and is not affected."
    - kind: removed
      description: "agent.config.bufferMaxBytes (KUBEADAPT_BUFFER_MAX_BYTES), which agent v3.2.0 does not read."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - openshift
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
