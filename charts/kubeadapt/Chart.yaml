apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.0.8
# The agent release this chart deploys (agent.image.tag). Keep in step with
# that tag; it is also the image tag used when agent.image.tag is empty.
appVersion: "v3.0.1"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.0.1"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: changed
      description: "The agent pod now meets the Kubernetes restricted Pod Security Standard by default: it runs as the image's non-root user (UID/GID 65532) with a RuntimeDefault seccomp profile, no privilege escalation, every capability dropped and a read-only root filesystem. The agent writes only to its emptyDir volumes. Settings live in agent.podSecurityContext and agent.securityContext; the auto-upgrade sidecar uses agent.autoUpgrade.securityContext. On OpenShift, set agent.podSecurityContext.runAsUser, runAsGroup and fsGroup to null so the restricted-v2 SCC can assign them."
    - kind: fixed
      description: "The auto-upgrade sidecar moves to kubeadapt-k8s-upgrader v3.0.2. Its upgrade Job meets the restricted Pod Security Standard and runs under the chart's upgrader service account; earlier releases referenced a service account the chart does not create, so upgrade Jobs could not start."
    - kind: added
      description: "A small /tmp emptyDir (agent.tmpVolume.sizeLimit, default 64Mi) because the root filesystem is read-only."
    - kind: changed
      description: "The chart is no longer marked as a pre-release, and appVersion now reports the agent release the chart deploys (v3.0.1) instead of a placeholder."
    - kind: changed
      description: "One compatibility matrix across README.md, COMPATIBILITY.md and the chart annotations, including GKE Autopilot, EKS Fargate and OpenShift, which components run where, and what helm uninstall leaves behind. existingSecret is documented as the recommended way to provide the agent token."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - openshift
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
