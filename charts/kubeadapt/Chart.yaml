apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.2.0
# The agent release this chart deploys (agent.image.tag). Keep in step with
# that tag; it is also the image tag used when agent.image.tag is empty.
appVersion: "v3.0.1"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.0.1"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: added
      description: "Every install gets a <name>-agent-rotated-token Secret where the agent stores a replacement token, with get and update on that Secret only (the <name>-agent-token Role). Upgrades render back what is in it; helm uninstall deletes it. The agent never writes the token Secret (<name>-agent or agent.config.existingSecret), so another tool can own that one. Both are mounted as files in the agent and auto-upgrade containers."
    - kind: added
      description: "secureops.enabled, off by default, grants the SecureOps permissions: get on Secrets in every namespace, used only for the image pull secrets workloads reference; list on Roles, ClusterRoles, RoleBindings, ClusterRoleBindings, Gateways and HTTPRoutes; and create and delete on Secrets in the release namespace for the Job-owned copy of a pull secret. They live in their own ClusterRole and Role, <name>-agent-secureops. With it false, the chart installs the same objects as 1.0.8."
    - kind: added
      description: "With secureops.enabled, a scanner service account without a Kubernetes API token, with optional cloud identity for private registries (secureops.scanner.cloudIdentity: IRSA role ARN, GKE Workload Identity, AKS Workload Identity; EKS Pod Identity is set up outside the chart), and a PriorityClass below the default priority that never preempts (secureops.priorityClass, or an existing class)."
    - kind: added
      description: "secureops.scanner sets the scan Job: the scanner image pinned by digest, resources (200m CPU and 256Mi requested, 768Mi limit), a 4Gi scratch volume, 2 Jobs at once (at most 8), a 15 minute deadline, tolerations and nodeSelector."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - openshift
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
