apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.1.0
# The agent release this chart deploys (agent.image.tag). Keep in step with
# that tag; it is also the image tag used when agent.image.tag is empty.
appVersion: "v3.2.0"

# Dependencies
dependencies:
  # The pulse chart in this repository, packaged into this chart at release
  # time. Pinning it from the OCI registry instead meant a pulse change needed
  # a second PR and release to reach this chart, and twice that second step
  # was missed (1.0.2 shipped pulse 1.0.0, 1.0.6-1.0.8 shipped pulse 1.0.1).
  # Keep the version equal to charts/kubeadapt-k8s-pulse/Chart.yaml.
  - name: kubeadapt-k8s-pulse
    version: "1.1.0"
    repository: "file://../kubeadapt-k8s-pulse"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: changed
      description: "The agent deploys kubeadapt-k8s-agent v3.2.0 and the network agent kubeadapt-k8s-pulse v3.2.0. Both are required for the flow channel below: pulse v3.1.0 refuses to send the token without TLS, and agent v3.0.1 has no flow listener."
    - kind: added
      description: "kubeadapt-k8s-pulse.enabled now connects pulse to the agent: the agent listens on global.pulseChannel.port (9091, published on its Service) and rejects pushes without a bearer token from a generated <name>-pulse-token Secret that upgrades reuse. The channel is plaintext gRPC, so the token and the flows travel unencrypted inside the cluster network. global.pulseChannel.existingSecret supplies your own token for renders without cluster access (helm template, Argo CD). agent.networkPolicy.pulseFrom adds a NetworkPolicy on that port."
    - kind: changed
      description: "Kubelet stats are read straight from each kubelet with nodes/stats get, and per node through the API server proxy where the kubelet cannot be used directly. agent.rbac.kubeletProxyFallback (default true) grants the nodes/proxy get that fallback needs. nodes/proxy get is exec-capable; set the value to false when every kubelet serving certificate is signed by the cluster CA and port 10250 is reachable."
    - kind: security
      description: "The upgrader can no longer widen its own rights: escalate is removed from its ClusterRole and Role, so it can write only RBAC whose permissions it already holds. A future release that adds an agent permission needs a manual helm upgrade; the upgrade Job fails and rolls back."
    - kind: security
      description: "The namespaced Role with secrets get/list, configmap writes and job create is bound to the agent's service account only while auto-upgrade is on (the upgrader sidecar uses it), renamed <name>-upgrader-sidecar and trimmed to the calls the upgrader makes."
    - kind: removed
      description: "Unused agent ClusterRole grants: replicationcontrollers, networkpolicies, karpenter nodeclaims, and watch on metrics.k8s.io."
    - kind: fixed
      description: "The agent ClusterRole grants discovery.k8s.io endpointslices list/watch, which the agent's service informer needs since agent v3.1.0. Without it the agent stayed unready for 5 minutes on every start and API-server traffic was billed as external."
    - kind: fixed
      description: "terminationGracePeriodSeconds is 120 (agent.terminationGracePeriodSeconds) whether or not the spool is on, covering the agent's 100s shutdown drain; it was 30s with the spool off."
    - kind: changed
      description: "The kubeadapt-k8s-pulse 1.1.0 subchart is packaged from this repository instead of pinned from the OCI registry, so each release ships the pulse chart of the same commit. It adds flow export, a read-only ClusterRole, dnsPolicy ClusterFirstWithHostNet, the memory-limit variable and the CNI configuration mount."
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - openshift
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
