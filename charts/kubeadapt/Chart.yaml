apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.0.0
appVersion: "0.1.0"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.0.0"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: image registry alias migrated; old registry will become unavailable"
    - kind: changed
      description: "BREAKING: subchart dependency renamed (ebpf-agent → kubeadapt-k8s-pulse). Move existing values overrides accordingly."
    - kind: changed
      description: "Image binaries renamed (kubeadapt-agent → kubeadapt-k8s-agent, kubeadapt-upgrader → kubeadapt-k8s-upgrader)"
    - kind: changed
      description: "Bumped images to v3.0.1 (agent, upgrader, kubeadapt-k8s-pulse)"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
