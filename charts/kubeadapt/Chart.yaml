apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.1.0
appVersion: "0.1.0"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.1.0"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: fixed
      description: "kubeadapt-k8s-pulse.enabled=true now delivers network telemetry. It opens the agent's flow listener on global.pulseListenPort (9091), publishes that port on the agent Service, and switches the collector's export on, pointed at that Service. Previously the flag deployed the collector without connecting it to anything, so no network data reached KubeAdapt. Nothing new renders when the flag is false. The collector-to-agent channel is plaintext; the chart sets no TLS variables on either side."
    - kind: security
      description: "The agent pod now meets the restricted Pod Security Standard. Pod level (agent.podSecurityContext): runAsNonRoot with runAsUser/runAsGroup/fsGroup 65532 and seccompProfile RuntimeDefault. The numeric UID is required because the image declares the user by name (nonroot). Agent container (agent.securityContext): allowPrivilegeEscalation false, all capabilities dropped, read-only root filesystem, with emptyDir volumes at /tmp and at the spool mount path for the only paths the agent writes. Upgrader sidecar (agent.autoUpgrade.securityContext): allowPrivilegeEscalation false, all capabilities dropped. All three are overridable."
    - kind: changed
      description: "kubeadapt-k8s-pulse subchart 1.0.1 -> 1.1.0: the DaemonSet runs with four capabilities (BPF, PERFMON, NET_ADMIN, SYS_PTRACE) instead of privileged, gets a read-only ClusterRole for its pod, node and CiliumEnvoyConfig reads, uses dnsPolicy ClusterFirstWithHostNet so it can resolve the agent Service, and runs pulse v3.1.0."
    - kind: fixed
      description: "The collector DaemonSet now tolerates every taint. This chart used to set kubeadapt-k8s-pulse.tolerations to [], which overrode the subchart default and left control-plane, GPU, spot and other tainted nodes unmeasured, with nothing reporting the gap."
    - kind: changed
      description: "Agent image v3.0.1 -> v3.1.0. The upgrader stays at v3.0.1."
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
