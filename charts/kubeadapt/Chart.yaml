apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.0.6
appVersion: "0.1.0"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.0.1"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: added
      description: "Give the agent an emptyDir write-ahead spool for network telemetry, mounted at agent.spool.mountPath (default /var/lib/kubeadapt) and bounded by agent.spool.sizeLimit (2Gi) and agent.spool.maxBytes (1 GiB). Telemetry is written to the spool before it is sent and removed once the backend has accepted it, so a container restart or an ingestion outage no longer loses network cost data. The pod's termination grace period is raised to 120s so the agent can drain the spool on SIGTERM. No PersistentVolume or PersistentVolumeClaim is created; set agent.spool.enabled=false to opt out."
    - kind: added
      description: "Set GOMEMLIMIT on the agent container from its own memory limit via the Downward API. The Go runtime otherwise sizes its heap against the node's memory and the agent is OOMKilled at the container limit instead of collecting more aggressively. Resource requests and limits are unchanged."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
