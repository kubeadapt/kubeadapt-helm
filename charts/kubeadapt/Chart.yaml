apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.1.0
# The agent release this chart deploys (agent.image.tag). Keep in step with
# that tag; it is also the image tag used when agent.image.tag is empty.
appVersion: "v3.0.1"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.1.0"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: security
      description: "The agent no longer holds nodes/proxy get, which is exec-capable: the kubelet authorises exec, attach and port-forward as nodes/proxy and a WebSocket upgrade is a GET, so a leaked agent token could run commands in every pod. Kubelet stats are read straight from each kubelet with nodes/stats get. agent.rbac.kubeletProxyFallback (default false) grants nodes/proxy for clusters whose kubelets self-sign their serving certificates."
    - kind: security
      description: "The upgrader can no longer widen its own rights: escalate is removed from its ClusterRole and Role, so it can write only RBAC whose permissions it already holds. A future release that adds an agent permission needs a manual helm upgrade; the upgrade Job fails and rolls back."
    - kind: security
      description: "The namespaced Role with secrets get/list, configmap writes and job create is bound to the agent's service account only while auto-upgrade is on (the upgrader sidecar uses it), renamed <name>-upgrader-sidecar and trimmed to the calls the upgrader makes."
    - kind: removed
      description: "Unused agent ClusterRole grants: replicationcontrollers, networkpolicies, karpenter nodeclaims, and watch on metrics.k8s.io."
    - kind: fixed
      description: "The agent ClusterRole grants discovery.k8s.io endpointslices list/watch, which the agent's service informer needs since agent v3.1.0. Without it the agent stayed unready for 5 minutes on every start and API-server traffic was billed as external."
    - kind: added
      description: "kubeadapt-k8s-pulse.enabled now connects pulse to the agent: the agent listens on global.pulseChannel.port (9091, published on its Service) and rejects pushes without a bearer token from a generated <name>-pulse-token Secret that upgrades reuse. The channel is plaintext gRPC, so the token and the flows travel unencrypted inside the cluster network. global.pulseChannel.existingSecret supplies your own token for renders without cluster access (helm template, Argo CD). agent.networkPolicy.pulseFrom adds a NetworkPolicy on that port. Requires a pulse release cut from main after its TLS client was removed; v3.1.0 refuses a token without TLS."
    - kind: fixed
      description: "terminationGracePeriodSeconds is 120 (agent.terminationGracePeriodSeconds) whether or not the spool is on, covering the agent's 100s shutdown drain; it was 30s with the spool off."
    - kind: changed
      description: "kubeadapt-k8s-pulse 1.1.0: flow export with a bearer token over plaintext gRPC, a read-only ClusterRole, and dnsPolicy ClusterFirstWithHostNet."
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - openshift
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
