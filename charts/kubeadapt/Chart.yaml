apiVersion: v2
name: kubeadapt
description: A Helm chart for Kubeadapt
type: application
version: 1.0.7
appVersion: "0.1.0"

# Dependencies
dependencies:
  - name: kubeadapt-k8s-pulse
    version: "1.0.1"
    repository: "oci://ghcr.io/kubeadapt/kubeadapt-helm"
    condition: kubeadapt-k8s-pulse.enabled

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - resource optimization
  - cost optimization
  - monitoring
  - cloud native
  - multi-cloud

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: added
      description: "Grant the agent ClusterRole get on nodes/proxy and nodes/stats so the kubelet Summary API can be read. It is the only source of per-pod network byte counters: metrics.k8s.io, already granted, carries CPU and memory and nothing else, so without this rule container_metrics.network_rx_bytes and network_tx_bytes are always zero. nodes/proxy serves the api_proxy transport and nodes/stats the direct kubelet transport. The verb is get alone, so the agent gets read-only access to the kubelet API through those two subresources, with no write and no exec."
    - kind: added
      description: "Add the chart-side plumbing for an agent write-ahead spool for network telemetry: an emptyDir volume mounted at agent.spool.mountPath (default /var/lib/kubeadapt), bounded by agent.spool.sizeLimit (2Gi) and agent.spool.maxBytes (1 GiB), the matching KUBEADAPT_SPOOL_DIR and KUBEADAPT_SPOOL_MAX_BYTES environment variables, and a 120s pod termination grace period. This is chart-side only: the volume and settings take effect once an agent release that writes to the spool ships, and agent images that predate it ignore the environment variables and leave the volume empty. No PersistentVolume or PersistentVolumeClaim is created; set agent.spool.enabled=false to opt out."
    - kind: added
      description: "Set GOMEMLIMIT on the agent container from its own memory limit via the Downward API. The Go runtime otherwise sizes its heap against the node's memory and the agent is OOMKilled at the container limit instead of collecting more aggressively. Resource requests and limits are unchanged."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      platforms:
        eks:
          versions: ["1.24-1.35"]
          tested: true
        aks:
          versions: ["1.24-1.35"]
          tested: true
        gke:
          versions: ["1.24-1.35"]
          tested: true
        on-premise:
          versions: ["1.24-1.35"]
          tested: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/README.md
    - name: Compatibility Matrix
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/COMPATIBILITY.md
    - name: Security Policy
      url: https://github.com/kubeadapt/kubeadapt-helm/blob/main/SECURITY.md
