# Global values for kubeadapt.
global:
  name: "kubeadapt"
  nameOverride: ""
  fullnameOverride: ""
  # Pull secrets for a registry that needs credentials, as a list of
  # {name: <secret>} in the release namespace. Used by the agent pod, the
  # network monitor and, through its service account, the upgrade Job.
  # Every image can be taken from your own registry: agent.image.repository,
  # agent.autoUpgrade.image.repository, agent.autoUpgrade.jobImage and
  # kubeadapt-k8s-pulse.image.repository.
  imagePullSecrets: []
  # Shared by the agent and the network monitor (kubeadapt-k8s-pulse). Used
  # only while kubeadapt-k8s-pulse.enabled is true.
  pulse:
    # Port of the agent's in-cluster listener that the network monitor sends
    # its traffic records to. Served by the <name>-agent-pulse ClusterIP Service.
    listenPort: 9091
    # The agent accepts records only from a sender that presents this token.
    # Empty: the chart creates the Secret <name>-pulse-token with a random
    # token on first install and keeps the same token on every helm upgrade.
    # Set this to use your own Secret instead, with the token under the key
    # "token". Set it as well when a tool renders the chart without cluster
    # access (helm template, for example), since the chart then cannot read
    # the existing token and would create a new one on every render.
    # Both pods mount the token as a file and read it again while running, so
    # changing the Secret rotates the token without a restart.
    existingSecret: ""

agent:
  enabled: true
  image:
    # renovate: datasource=docker depName=public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-agent
    repository: public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-agent
    tag: "v3.0.1"
    pullPolicy: IfNotPresent
  # ============================================================
  # Service Account Configuration
  # ============================================================
  # Service account for agent pod
  serviceAccount:
    # Create a service account for the agent
    create: true
    # Annotations for the service account
    # Example:
    #   custom-annotation: value
    annotations: {}
    # Override the service account name (default: kubeadapt-agent)
    name: ""
  rbac:
    create: true
  service:
    type: ClusterIP
  # Extra annotations and labels for the agent pod, for example the ones a
  # policy engine matches on or a scrape configuration selects by. The chart's
  # own labels (app.kubernetes.io/name, instance and component) cannot be
  # replaced: the Deployment selects its pod by them.
  podAnnotations: {}
  podLabels: {}
  # NetworkPolicy that admits the network monitor to the agent's listener
  # (global.pulse.listenPort). Needed only where the release namespace denies
  # ingress by default, and created only while kubeadapt-k8s-pulse.enabled is
  # true. Leave it off in a namespace without policies: selecting the agent
  # pod with any policy closes its other ports to everything the namespace's
  # policies do not allow.
  networkPolicy:
    enabled: false
    # Address ranges of the cluster's nodes, required when enabled. The
    # network monitor runs in the node's network, so its connections come from
    # node addresses and a pod selector never matches them. On EKS, AKS and
    # GKE this is the VPC or subnet range the nodes take their addresses from.
    # Example: ["10.0.0.0/16"]
    nodeCIDRs: []
  # ONE Deployment per cluster, so memory scales with TOTAL cluster size - a
  # DaemonSet's stays flat per node. Peak is the network-flow merge, measured at
  # ~1550 B per inbound flow row plus ~300 MB of caches at 5000 nodes. At 500
  # flows per node per 60s window:
  #
  #     nodes    inbound rows    modelled peak
  #       500            250k          ~0.44 GB
  #      1000            500k          ~0.88 GB
  #      2000              1M          ~1.7 GB
  #      5000            2.5M          ~4.2 GB
  #
  # 16Gi carries 5000 nodes at ~4x headroom, and covers flow-heavy clusters
  # (high pod fan-out, many distinct external destinations) where the per-node
  # flow count runs 2-4x the 500 assumed above. A limit is a ceiling, not a
  # reservation, so the unused headroom costs nothing on smaller clusters.
  #
  # Requests are deliberately NOT scaled with the limit: they are a scheduling
  # floor and must keep the chart installable on small clusters.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 16Gi

  # ============================================================
  # Pod Security
  # ============================================================
  # Defaults meet the Kubernetes "restricted" Pod Security Standard: non-root,
  # no privilege escalation, every capability dropped, RuntimeDefault seccomp
  # and a read-only root filesystem. The agent writes only to its emptyDir
  # volumes (the spool/state directory and /tmp).
  #
  # OpenShift: the restricted-v2 SCC assigns the UID and GID from the
  # namespace's range, so drop the fixed IDs:
  #   --set agent.podSecurityContext.runAsUser=null \
  #   --set agent.podSecurityContext.runAsGroup=null \
  #   --set agent.podSecurityContext.fsGroup=null
  podSecurityContext:
    runAsNonRoot: true
    # 65532 is the distroless "nonroot" user the agent image runs as. A numeric
    # UID is needed: the image names its user, and runAsNonRoot cannot verify a
    # named user.
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Writable scratch space, since the root filesystem is read-only.
  tmpVolume:
    sizeLimit: 64Mi

  # ============================================================
  # Network Telemetry Spool
  # ============================================================
  spool:
    # Write-ahead spool for network telemetry, on an emptyDir. It keeps the
    # batches the backend has not acknowledged through a container restart and
    # an ingestion outage; when the pod is replaced, the agent tries to deliver
    # them within the termination grace period. The agent's restart-surviving
    # caches share the volume. No PersistentVolume is ever created.
    enabled: true
    # Ceiling the kubelet enforces on the emptyDir itself. Kept above maxBytes
    # so the agent's own bound is what evicts, not a pod eviction.
    sizeLimit: 2Gi
    # KUBEADAPT_SPOOL_MAX_BYTES, 1 GiB - the agent's own cap on spool contents.
    maxBytes: "1073741824"
    # Mount point for the volume; the spool itself lives in <mountPath>/netspool.
    mountPath: /var/lib/kubeadapt

  # ============================================================
  # Agent Configuration
  # ============================================================
  config:
    # ============================================================
    # Authentication & Backend Configuration
    # ============================================================
    # Token for authenticating with the Kubeadapt backend.
    # This is provided when you create a cluster in the Kubeadapt platform.
    token: ""

    # Use an existing Kubernetes Secret instead of creating one from config.token.
    # Recommended for production: the token then never appears on a command
    # line, in shell history or in `helm get values`.
    # The Secret must contain a key named "token" with the agent token value.
    # When set, config.token is ignored and no Secret is created by the chart.
    #   kubectl create secret generic kubeadapt-agent-token \
    #     --namespace kubeadapt --from-literal=token='<your-token>'
    # Example: existingSecret: "kubeadapt-agent-token"
    #
    # On a release that was installed with config.token, create the new
    # Secret before the upgrade that sets this, under another name than
    # <name>-agent: Helm deletes the chart's own <name>-agent Secret in that
    # upgrade. To copy the token without showing it:
    #   kubectl -n kubeadapt get secret kubeadapt-agent -o jsonpath='{.data.token}' | base64 --decode \
    #     | kubectl -n kubeadapt create secret generic kubeadapt-agent-token --from-file=token=/dev/stdin
    #
    # One of config.token and config.existingSecret is required; the chart
    # does not render without.
    existingSecret: ""

    # Backend API endpoint
    backendUrl: "https://ingest.kubeadapt.io"

    # ============================================================
    # Collection Settings
    # ============================================================
    # How often agent collects cluster state snapshots (Go duration or seconds).
    # Min: 10s. Recommended: 60s.
    snapshotInterval: "60s"

    # How often agent collects resource metrics (Go duration or seconds).
    # Min: 10s. Recommended: 60s.
    metricsInterval: "60s"

    # Kubernetes informer resync period (Go duration or seconds).
    informerResync: "300s"

    # ============================================================
    # Data Compression Settings
    # ============================================================
    # Compression level for data sent to backend (1-4).
    # 1=fastest/least compression, 4=slowest/best compression
    # Recommended: 3 (good balance of speed and compression ratio)
    compressionLevel: 3

    # ============================================================
    # HTTP Client Settings
    # ============================================================
    # Max retry attempts for failed backend requests.
    maxRetries: 5

    # Timeout for HTTP requests to backend (Go duration or seconds).
    requestTimeout: "30s"

    # Max buffer size in bytes (default: 50 MB).
    bufferMaxBytes: "52428800"

    # ============================================================
    # Observability & Debugging
    # ============================================================
    # HTTP port for health check and metrics endpoint
    # Exposes /healthz, /readyz, /metrics endpoints
    healthPort: 8080

    # Enable pprof/debug endpoints on health port
    # WARNING: Only enable for troubleshooting
    debugEndpoints: false

    # ============================================================
    # GPU Metrics (Optional)
    # ============================================================
    # Enable GPU metrics collection from DCGM exporter
    # Requires DCGM exporter to be running in cluster (e.g., via gpu-operator)
    # Collects: GPU utilization, memory usage
    gpuMetricsEnabled: true

    # DCGM exporter port (default: 9400)
    dcgmPort: 9400

    # DCGM exporter namespace (auto-detect if empty)
    dcgmNamespace: ""

    # DCGM exporter endpoints override (comma-separated IPs/hosts)
    # Use this if kubeadapt auto-discovery fails to find DCGM exporter pods.
    # Example: "10.0.1.5,10.0.2.3"
    dcgmEndpoints: ""

  # ============================================================
  # Auto-Upgrade Configuration
  # ============================================================
  # Enables automatic chart upgrades when new versions are available.
  # The agent checks for updates periodically and spawns a Helm upgrade Job.
  autoUpgrade:
    # Enable/disable auto-upgrade feature
    enabled: false

    # Upgrader sidecar image
    image:
      # renovate: datasource=docker depName=public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-upgrader
      repository: public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-upgrader
      tag: "v3.0.2"
      pullPolicy: IfNotPresent

    # Resource limits for the upgrader sidecar
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Container security context for the upgrader sidecar (restricted Pod
    # Security Standard). The pod-level settings come from agent.podSecurityContext.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    # How often to check for updates
    checkInterval: "24h"

    # Upgrade policy - controls which versions to upgrade to
    # Options:
    #   - "minor": Upgrade minor and patch versions (0.17.x -> 0.18.x) - DEFAULT
    #   - "patch": Only upgrade patch versions (0.17.0 -> 0.17.1)
    #   - "all": Upgrade all versions including major (breaking changes)
    policy: "minor"

    # Release channel
    # Options:
    #   - "stable": Production-ready releases (recommended)
    #   - "fast": Early access releases (may have bugs)
    # Releases from 1.0.8 on are published to both channels
    channel: "fast"

    # Upgrade timeout - how long to wait for helm upgrade to complete. The
    # upgrade waits for the agent and for the network monitor's rollout, and
    # rolls everything back when the time is up. That rollout takes
    # (100 / maxUnavailable percent) waves of about a minute each, whatever
    # the number of nodes; see kubeadapt-k8s-pulse.updateStrategy before
    # lowering either setting.
    timeout: "15m"

    # Helm image for upgrade Job
    # Contains helm binary for performing upgrades. A full image reference:
    # point it at your own registry when you mirror images.
    jobImage: "alpine/helm:3.14.3"

    # Chart repository URL for Helm upgrades
    # Leave empty to use the default OCI registry (production default)
    # Set to HTTP URL for testing: http://chartmuseum:8080
    chartRepo: ""

    # Initial delay before the first upgrade check
    # Default: 1m
    # Set to 5s for faster tests
    initialDelay: "1m"

    # Dry-run mode - detects updates and logs them but does NOT create a Helm upgrade Job.
    # Useful for validating upgrade logic without performing actual upgrades.
    # Default: false
    dryRun: false

    # Service account for upgrade Job
    # The Job needs permissions to manage Helm releases (secrets/configmaps)
    # and update all KubeAdapt resources during upgrade
    serviceAccount:
      create: true
      annotations: {}
      name: ""

    # RBAC for upgrade ServiceAccount
    # Permissions needed to perform helm upgrade operations
    rbac:
      create: true
  # ============================================================
  # Additional Environment Variables
  # ============================================================
  # Custom environment variables to inject into agent pod
  # Use this for advanced configuration or cloud-specific settings
  env: []

  tolerations: []

  nodeSelector: {}

  affinity: {}

  topologySpreadConstraints: []

# ============================================================
# Network Monitor (Network Cost Tracking)
# ============================================================
# Deploys a DaemonSet that measures each pod's network traffic with eBPF and
# sends it to the agent, which reports it to Kubeadapt as network cost.
#
# When enabled, the chart also turns on the agent's listener for it, exposes
# that listener on the <name>-agent-pulse ClusterIP Service, and gives both
# sides the same token (see global.pulse).
#
# Prerequisites:
# - Linux kernel 5.10 or newer on every node it runs on
# - The node's network namespace, host paths and the Linux
#   capabilities BPF, PERFMON, NET_ADMIN, SYS_RESOURCE and SYS_PTRACE, which
#   GKE Autopilot and EKS Fargate do not allow. The namespace must allow the
#   privileged Pod Security level; on OpenShift, use the privileged SCC.
#   examples/network-monitor in the chart repository has ready-made
#   exceptions for Pod Security Admission, Kyverno and Gatekeeper.
#
# For all options, see charts/kubeadapt-k8s-pulse/values.yaml. The ones a
# large or locked-down cluster usually needs, all under this key:
#   image.repository, imagePullSecrets   a private registry
#   tolerations, nodeRequirements        which nodes get a pod
#   priorityClass, priorityClassName     wait on a full node, or evict for room
#   updateStrategy                       how fast a change rolls out
#   config.metricsPort                   the node port of its health server
#   seLinuxOptions, privileged           nodes that enforce SELinux
kubeadapt-k8s-pulse:
  # Set to true to deploy the network monitor DaemonSet.
  enabled: false

  config:
    export:
      # Send traffic records to this release's agent.
      enabled: true

  # By default the DaemonSet runs on every Linux node, tainted ones included,
  # except AWS Fargate and virtual-kubelet nodes, and never evicts a workload
  # to get there: on a node without room its pod waits and the node is not
  # measured. priorityClass.create: true gives it a place on every node.
