# upgrade-metadata.yaml
# Defines explicit upgrade paths for this chart version.
# This file is embedded in the chart package and used by KubeAdapt auto-upgrade system.

chartVersion: "1.1.0"

# Versions that can upgrade to this version
upgradeFrom:
  - "1.0.7"
  - "1.0.6"
  - "1.0.5"
  - "1.0.4"
  - "1.0.3"
  - "1.0.2"
  - "1.0.1"
  - "1.0.0"
  - "0.18.6"
  - "0.18.5"
  - "0.18.4"
  - "0.18.3"
  - "0.18.2"
  - "0.18.1"
  - "0.18.0"
  - "0.17.0"

# Channels this version is available in
channels:
  - fast

# Optional metadata
metadata:
  releaseNotes: "https://github.com/kubeadapt/kubeadapt-helm/releases/tag/kubeadapt-1.0.1"
  # The agent pod gains a restricted-profile securityContext and the pulse
  # subchart drops privileged: true for four capabilities.
  containsSecurityUpdates: true
  minKubernetesVersion: "1.24.0"
  breakingChanges: []
