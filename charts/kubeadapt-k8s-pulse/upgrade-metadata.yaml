# upgrade-metadata.yaml
# Defines explicit upgrade paths for this chart version.
# This file is embedded in the chart package and used by KubeAdapt auto-upgrade system.

chartVersion: "1.1.0"

# Versions that can upgrade to this version
upgradeFrom:
  - "1.0.2"
  - "1.0.1"
  - "1.0.0"

# Channels this version is available in
# - stable: Production-ready releases
# - fast: Early access releases
channels:
  - fast
  # A new minor ships fast-only (docs/RELEASE-POLICY.md); a patch release
  # promotes it to stable.

# Optional metadata
metadata:
  releaseNotes: "https://github.com/kubeadapt/kubeadapt-helm/releases/tag/kubeadapt-k8s-pulse-1.1.0"
  containsSecurityUpdates: true
  minKubernetesVersion: "1.24.0"
  minKernelVersion: "5.10"
