# KubeAdapt eBPF Network Metrics Agent
# High-performance eBPF-based network observation for Kubernetes

# Enable/disable the agent
enabled: true

image:
  repository: public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-pulse
  tag: "v3.0.1"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ============================================================
# eBPF Agent Configuration
# ============================================================
config:
  # Metrics server port for Prometheus scraping
  # Exposes: /metrics, /health/live, /health/ready
  metricsPort: 9090

  # Collection interval for BPF map reads, leave it as is, unless you have specific needs
  collectionInterval: "25s"

  # Log level for agent
  # Options: "debug", "info", "warn", "error"
  logLevel: "info"

  # Log format
  # Options: "json" (production), "console" (development)
  logFormat: "json"

  # Enable connection tracking (read-then-delete pattern with overflow ringbuffer)
  connectionTracking: true

  # ============================================================
  # Debug Options (use with caution in production)
  # ============================================================
  # Enable pprof profiling endpoints
  enableProfiling: false
  profilingPort: 6060

  # Dump BPF maps before deletion (synchronized with collection cycle)
  # WARNING: High I/O, only enable for troubleshooting
  dumpBPFMaps: false

# Resource limits for eBPF agent
# Note: eBPF agents are lightweight but require sufficient memory for BPF maps
resources:
  requests:
    # 129-155Mi measured across 3 pods (up to 121% of the old 128Mi request).
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 384Mi

# ============================================================
# Scheduling Configuration
# ============================================================
# Default tolerations to run on all nodes including masters
tolerations: []

nodeSelector: {}

affinity: {}

topologySpreadConstraints: []

# Additional environment variables
env: []

# Security posture for the pulse DaemonSet.
#
# The defaults below are the LEAST-PRIVILEGE posture, which was verified against
# a live Talos 6.18 node rather than inferred. See the securityContext comment
# in templates/daemonset.yaml for the measurement.
security:
  # privileged: true restores the previous posture (39 capabilities). Kept as an
  # escape hatch for a kernel or distribution where the capability set below
  # turns out to be insufficient; if you need it, that is a bug worth reporting
  # rather than a setting worth keeping.
  privileged: false

  # The four capabilities every privileged operation the agent performs was
  # measured to need. CAP_SYS_RESOURCE is absent on purpose (memlock moved to
  # the memory cgroup in 5.11); CAP_DAC_READ_SEARCH does not substitute for
  # CAP_SYS_PTRACE, because /proc/<pid>/exe is gated by ptrace_may_access.
  capabilities:
    - BPF
    - PERFMON
    - NET_ADMIN
    - SYS_PTRACE

  # hostPID defaults to true so a chart upgrade ahead of an image upgrade cannot
  # silently empty the container inventory. Set to false once the running image
  # includes the fingerprint scanner's /host/proc preference.
  hostPID: true
