{{- if and .Values.enabled (.Values.rbac | default dict).create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeadapt-k8s-pulse.clusterRoleName" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
rules:
  # Pod identity: each pod watches only the pods on its own node, through a
  # field selector that RBAC cannot express, so the rule is cluster-wide.
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["list", "watch"]

  # Node identity: one read of the pod's own Node at startup, for its UID and zone.
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get"]

  # On Cilium, one list at startup to detect an in-cluster Envoy proxy that
  # hides backend pod addresses. Matches nothing on other clusters.
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumenvoyconfigs
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeadapt-k8s-pulse.clusterRoleName" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeadapt-k8s-pulse.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeadapt-k8s-pulse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
