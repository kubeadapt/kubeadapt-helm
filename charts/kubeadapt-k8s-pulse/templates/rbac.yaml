{{- if and .Values.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeadapt-k8s-pulse.clusterRoleName" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
rules:
  {{- include "kubeadapt-k8s-pulse.clusterRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeadapt-k8s-pulse.clusterRoleName" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeadapt-k8s-pulse.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeadapt-k8s-pulse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
