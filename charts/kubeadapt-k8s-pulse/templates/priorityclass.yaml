{{- $class := .Values.priorityClass | default dict }}
{{- if and .Values.enabled $class.create }}
# Never preempts: a pod of this class waits for room instead of evicting
# another pod, and is not evicted to make room for lower-priority pods.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "kubeadapt-k8s-pulse.priorityClassName" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
value: {{ $class.value | default 1000000 | int64 }}
preemptionPolicy: Never
globalDefault: false
description: Kubeadapt network monitor. Does not preempt other pods.
{{- end }}
