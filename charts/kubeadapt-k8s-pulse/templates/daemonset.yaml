{{- if .Values.enabled }}
{{- /*
Settings are read through maps that may be empty, so that values written for
an earlier release (see validate.yaml) end in its message, not in a nil
pointer.
*/}}
{{- $config := .Values.config | default dict }}
{{- $export := $config.export | default dict }}
{{- $image := .Values.image | default dict }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubeadapt-k8s-pulse.fullname" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kubeadapt-k8s-pulse.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml (.Values.updateStrategy | default (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxUnavailable" "25%"))) | nindent 4 }}
  template:
    metadata:
      labels:
        {{- /* The selector labels win over a podLabels entry of the same name. */}}
        {{- toYaml (merge (include "kubeadapt-k8s-pulse.selectorLabels" . | fromYaml) (.Values.podLabels | default dict)) | nindent 8 }}
      annotations:
        {{- /* The scrape annotations are defaults: podAnnotations can replace each of them. */}}
        {{- $scrape := dict "prometheus.io/scrape" "true" "prometheus.io/port" ($config.metricsPort | toString) "prometheus.io/path" "/metrics" }}
        {{- toYaml (merge (deepCopy (.Values.podAnnotations | default dict)) $scrape) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubeadapt-k8s-pulse.serviceAccountName" . }}
      # The node's network namespace: pulse attaches to the host side of
      # each pod's network interface and follows interface changes there.
      hostNetwork: true
      dnsPolicy: {{ .Values.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- with include "kubeadapt-k8s-pulse.priorityClassName" . }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      {{- with include "kubeadapt-k8s-pulse.imagePullSecrets" . }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: kubeadapt-k8s-pulse
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          ports:
            # With hostNetwork this is a port of the node itself.
            - name: metrics
              containerPort: {{ $config.metricsPort }}
              protocol: TCP
          env:
            # DaemonSet pod identity (for Prometheus metric labels)
            - name: DAEMONSET_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DAEMONSET_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Pod metadata
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # This container's memory limit in bytes. Pulse sizes its kernel
            # maps and Go memory limit from it; in its own PID namespace it
            # cannot find its cgroup on the node to read the limit there.
            - name: KUBEADAPT_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: kubeadapt-k8s-pulse
                  resource: limits.memory
                  divisor: "1"

            # ============================================================
            # eBPF Agent Configuration
            # ============================================================
            - name: EBPF_LOG_LEVEL
              value: {{ $config.logLevel | quote }}
            - name: EBPF_LOG_FORMAT
              value: {{ $config.logFormat | quote }}
            - name: EBPF_METRICS_PORT
              value: {{ $config.metricsPort | quote }}
            - name: EBPF_CONNECTION_TRACKING
              value: {{ $config.connectionTracking | quote }}
            {{- if $export.enabled }}

            # Export to the Kubeadapt agent
            - name: EBPF_EXPORT_ENABLED
              value: "true"
            - name: EBPF_AGENT_ENDPOINT
              value: {{ include "kubeadapt-k8s-pulse.agentEndpoint" . | quote }}
            - name: EBPF_AGENT_AUTH_TOKEN_FILE
              value: /var/run/secrets/kubeadapt/pulse/token
            {{- end }}

            # Debug options
            {{- if $config.enableProfiling }}
            - name: EBPF_ENABLE_PROFILING
              value: "true"
            - name: EBPF_PROFILING_PORT
              value: {{ $config.profilingPort | quote }}
            {{- end }}

            {{- if .Values.env }}
            # Additional custom environment variables
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}

          securityContext:
            {{- if .Values.privileged }}
            privileged: true
            {{- else }}
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              {{- with .Values.capabilities }}
              add:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
            readOnlyRootFilesystem: true
            # Root, because the BPF filesystem and the cgroup tree pulse uses
            # are owned by root.
            runAsNonRoot: false
            runAsUser: 0
            {{- with .Values.seccompProfile }}
            seccompProfile:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.seLinuxOptions }}
            seLinuxOptions:
              {{- toYaml . | nindent 14 }}
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            # The node's processes, read for the container runtime inventory.
            - name: proc
              mountPath: /host/proc
              readOnly: true
            # Writable: pulse pins its flow table here so a restart resumes
            # it, and holds the lock that keeps one instance per node. On
            # Cilium it also reads Cilium's connection tracking maps here.
            # HostToContainer shows a BPF filesystem the node mounts later.
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            # The node's cgroup tree: finding pod cgroups, attaching the
            # cgroup programs, reading this container's memory usage.
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            # The node's CNI configuration, read to identify the CNI and the
            # encapsulation overhead it adds to each packet.
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
              readOnly: true
            # Where an Istio ambient mesh places its ztunnel socket. Only the
            # socket's presence is checked.
            - name: ztunnel
              mountPath: /host/var/run/ztunnel
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $export.enabled }}
            - name: agent-token
              mountPath: /var/run/secrets/kubeadapt/pulse
              readOnly: true
            {{- end }}

          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ $config.metricsPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $config.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: ztunnel
          hostPath:
            path: /var/run/ztunnel
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
        {{- if $export.enabled }}
        # Token presented to the agent, mounted as a file so that a changed
        # Secret is picked up on the next send.
        - name: agent-token
          secret:
            secretName: {{ include "kubeadapt-k8s-pulse.tokenSecretName" . }}
            items:
              - key: token
                path: token
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "kubeadapt-k8s-pulse.affinity" . }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
