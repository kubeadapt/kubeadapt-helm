{{- if .Values.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubeadapt-k8s-pulse.fullname" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kubeadapt-k8s-pulse.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "kubeadapt-k8s-pulse.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.config.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "kubeadapt-k8s-pulse.serviceAccountName" . }}
      # Required for eBPF: access to host network namespace
      hostNetwork: true
      # Required for eBPF: access to host PID namespace for process tracking
      # hostPID places the agent in the host's PID namespace, where it can see
      # and signal every process on the node and every process can see it. It
      # was needed because the ELF fingerprint scanner read "/proc".
      #
      # Since the scanner prefers the read-only /host/proc bind mount, the
      # namespace is no longer required for the data. Measured on a Talos 6.18
      # node with hostPID: false: all 583 host PIDs were visible under
      # /host/proc and all 304 userspace processes had their ELF opened
      # successfully, 0 failures (the remaining 279 are kernel threads, which
      # have no exe link under any configuration).
      #
      # Defaults to true so that a chart upgrade in front of an older image --
      # one whose scanner still reads "/proc" -- does not silently empty the
      # container inventory. Set security.hostPID=false once the agent image is
      # at or past the release that added the /host/proc preference.
      hostPID: {{ .Values.security.hostPID }}
      containers:
        - name: kubeadapt-k8s-pulse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
          env:
            # DaemonSet pod identity (for Prometheus metric labels)
            - name: DAEMONSET_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DAEMONSET_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Pod metadata
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # ============================================================
            # eBPF Agent Configuration
            # ============================================================
            - name: EBPF_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: EBPF_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: EBPF_METRICS_PORT
              value: {{ .Values.config.metricsPort | quote }}
            - name: EBPF_COLLECTION_INTERVAL
              value: {{ .Values.config.collectionInterval | quote }}
            - name: EBPF_CONNECTION_TRACKING
              value: {{ .Values.config.connectionTracking | quote }}

            # Debug options
            {{- if .Values.config.enableProfiling }}
            - name: EBPF_ENABLE_PROFILING
              value: "true"
            - name: EBPF_PROFILING_PORT
              value: {{ .Values.config.profilingPort | quote }}
            {{- end }}
            {{- if .Values.config.dumpBPFMaps }}
            - name: EBPF_DUMP_BPF_MAPS
              value: "true"
            {{- end }}

            {{- if .Values.env }}
            # Additional custom environment variables
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}

          securityContext:
            # Four capabilities instead of privileged mode.
            #
            # `privileged: true` granted 39 capabilities (CapEff
            # 000001ffffbeffff on a Talos 6.18 node), including CAP_SYS_MODULE,
            # CAP_SYS_RAWIO and CAP_DAC_OVERRIDE, none of which this agent uses.
            #
            # The set below was determined by MEASUREMENT, not by reading docs:
            # a probe performing every privileged operation the agent actually
            # performs was run on a live node under each candidate set on
            # 2026-09-01. With these four (CapEff 000000c000081000) all fifteen
            # succeeded -- BPF map creation, program load and verification,
            # pinning to bpffs, TCX attach on both hooks at the Head anchor, the
            # classic-TC clsact fallback, conntrack netlink subscribe and
            # full-table dump, netlink link subscribe, and reading
            # /proc/<pid>/exe for the container inventory.
            #
            #   CAP_BPF + CAP_PERFMON  map creation, program load, the verifier
            #   CAP_NET_ADMIN          TCX/TC attach, netlink, conntrack events
            #   CAP_SYS_PTRACE         /proc/<pid>/exe for the ELF fingerprint
            #
            # CAP_SYS_RESOURCE is deliberately absent: memlock accounting moved
            # to the memory cgroup in kernel 5.11, and rlimit.RemoveMemlock
            # succeeds without it on every kernel this agent supports.
            #
            # CAP_DAC_READ_SEARCH does NOT substitute for CAP_SYS_PTRACE, which
            # is worth stating because it looks like it should: /proc/<pid>/exe
            # is gated by ptrace_may_access rather than by file permissions, and
            # the measured result with DAC_READ_SEARCH was EACCES.
            {{- if .Values.security.privileged }}
            privileged: true
            {{- else }}
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                {{- toYaml .Values.security.capabilities | nindent 16 }}
            {{- end }}
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              # HostToContainer, not Bidirectional.
              #
              # Bidirectional exists so mounts CREATED INSIDE the container
              # propagate back to the host, and the agent creates none: it never
              # calls mount(). It does MkdirAll and BPF_OBJ_PIN into a bpffs the
              # host already mounted, which are file operations on an existing
              # mount. Verified by grep -- there is no mount syscall anywhere in
              # the agent.
              #
              # It is also what blocked least privilege. Kubernetes rejects
              # Bidirectional propagation outright for a non-privileged
              # container ("Bidirectional mount propagation is available only to
              # privileged containers"), so this line, not any capability, was
              # the thing keeping privileged: true. That was found by the API
              # server refusing the patch on a live cluster.
              mountPropagation: HostToContainer
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.config.metricsPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.config.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
