{{- if .Values.enabled }}
{{- $agentEndpoint := include "kubeadapt-k8s-pulse.agentEndpoint" . }}
{{- $tokenSecret := include "kubeadapt-k8s-pulse.tokenSecret" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubeadapt-k8s-pulse.fullname" . }}
  labels:
    {{- include "kubeadapt-k8s-pulse.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kubeadapt-k8s-pulse.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "kubeadapt-k8s-pulse.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.config.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "kubeadapt-k8s-pulse.serviceAccountName" . }}
      # Required for eBPF: access to host network namespace
      hostNetwork: true
      # With hostNetwork, the default ClusterFirst policy falls back to the
      # node's resolver, which cannot resolve cluster Service names such as
      # the agent endpoint below.
      dnsPolicy: {{ .Values.dnsPolicy }}
      # Required for eBPF: access to host PID namespace for process tracking
      hostPID: true
      containers:
        - name: kubeadapt-k8s-pulse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
          env:
            # DaemonSet pod identity (for Prometheus metric labels)
            - name: DAEMONSET_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DAEMONSET_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # This node: the pod informer's field selector and the Node read
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The container's memory limit. Pulse sizes its BPF maps and Go
            # memory limit from it; with the cgroup filesystem mounted from the
            # host it cannot find its own memory.max, so this is its primary
            # source. Do not set GOMEMLIMIT: an explicit value disables pulse's
            # own limit, which reserves room for the BPF maps.
            - name: KUBEADAPT_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: kubeadapt-k8s-pulse
                  resource: limits.memory
                  divisor: "1"

            # ============================================================
            # eBPF Agent Configuration
            # ============================================================
            - name: EBPF_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: EBPF_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: EBPF_METRICS_PORT
              value: {{ .Values.config.metricsPort | quote }}
            - name: EBPF_CONNECTION_TRACKING
              value: {{ .Values.config.connectionTracking | quote }}

            {{- if $agentEndpoint }}

            # Flow export to the Kubeadapt agent
            - name: EBPF_EXPORT_ENABLED
              value: "true"
            - name: EBPF_AGENT_ENDPOINT
              value: {{ $agentEndpoint | quote }}
            {{- if $tokenSecret }}
            # Bearer token the agent checks on every push. The channel is
            # plaintext gRPC, so the token travels UNENCRYPTED inside the
            # cluster network: it proves the sender to the agent, it does not
            # hide the flows or itself from anything that can observe node
            # traffic. A file, not an env value, so it never appears in the pod
            # spec.
            - name: EBPF_AGENT_AUTH_TOKEN_FILE
              value: /etc/kubeadapt/pulse-token/token
            {{- end }}
            {{- end }}

            # Debug options
            {{- if .Values.config.enableProfiling }}
            - name: EBPF_ENABLE_PROFILING
              value: "true"
            - name: EBPF_PROFILING_PORT
              value: {{ .Values.config.profilingPort | quote }}
            {{- end }}
            {{- if .Values.config.dumpBPFMaps }}
            - name: EBPF_DUMP_BPF_MAPS
              value: "true"
            {{- end }}

            {{- if .Values.env }}
            # Additional custom environment variables
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}

          securityContext:
            # eBPF agents require privileged mode for:
            # - BPF syscalls and map operations
            # - Bidirectional mount propagation for BPF maps
            # - Kernel tracepoint attachment
            privileged: true
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: bpf-maps
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # The node's CNI configuration, read to measure the overlay's
            # encapsulation overhead that bytes_wire includes. Pulse looks under
            # /host first; without it the overhead is unknown and bytes_wire
            # understates an overlay datapath.
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
              readOnly: true
            {{- if and $agentEndpoint $tokenSecret }}
            - name: pulse-token
              mountPath: /etc/kubeadapt/pulse-token
              readOnly: true
            {{- end }}

          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.config.metricsPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.config.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
        # No type check: pulse starts without this directory and logs a
        # warning, so a node that keeps its CNI configuration elsewhere must not
        # keep the pod from starting, and the chart has no reason to create it.
        - name: cni-conf
          hostPath:
            path: {{ .Values.cniConfigDir }}
        {{- if and $agentEndpoint $tokenSecret }}
        - name: pulse-token
          secret:
            secretName: {{ $tokenSecret }}
            defaultMode: 0400
            items:
              - key: token
                path: token
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
