apiVersion: v2
name: kubeadapt-k8s-pulse
description: High-performance eBPF-based network metrics agent for Kubernetes
type: application
version: 1.1.0
appVersion: "3.2.0"

home: https://github.com/kubeadapt/kubeadapt-k8s-pulse
sources:
  - https://github.com/kubeadapt/kubeadapt-k8s-pulse

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - ebpf
  - network
  - monitoring
  - metrics
  - prometheus
  - observability
  - bandwidth
  - traffic
  - daemonset

# Additional metadata
annotations:
  # Oldest network monitor release this chart may run; the templates refuse an
  # older image.tag. It must be a release that attaches with TCX where the
  # kernel has it and, on older kernels, with a classic tc filter at its own
  # priority that never replaces another program's filter. v3.2.0 is the first
  # such release: v3.0.x replaces the filter at priority 1, handle 1 on every
  # kernel, and v3.1.0 does so on kernels older than 6.6.
  kubeadapt.io/minimum-image-version: "3.2.0"
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: changed
      description: "Deploys network monitor v3.2.0, the first release that attaches its classic tc filter at its own priority instead of replacing the filter at priority 1, handle 1, the slot where some CNI plugins and network policy agents keep their own filter. The chart refuses image tags older than v3.2.0."
    - kind: added
      description: "A ClusterRole for the reads pulse makes: list and watch pods, get nodes, list ciliumenvoyconfigs.cilium.io (rbac.create). Without it pulse reports traffic without pod and node identity."
    - kind: added
      description: "Export to the Kubeadapt agent (config.export): pulse sends each node's traffic records to the agent's listener with a bearer token read from a file. The kubeadapt chart turns it on and supplies the endpoint and the token; installed on its own, export stays off."
    - kind: changed
      description: "The pod mounts the node's /etc/cni/net.d read-only at /host/etc/cni/net.d to tell the CNI and its encapsulation overhead, gets its memory limit as KUBEADAPT_MEMORY_LIMIT_BYTES, resolves cluster names with dnsPolicy ClusterFirstWithHostNet, and no longer uses the node's PID namespace or mounts /sys and /sys/kernel/debug."
    - kind: added
      description: "nodeRequirements keeps the DaemonSet off nodes where its pod cannot start (non-Linux, AWS Fargate, virtual-kubelet). Optional: a priority class (priorityClassName, priorityClass.create), privileged: false with a reduced capability set, istioAmbient, imagePullSecrets, podAnnotations and podLabels."
    - kind: removed
      description: "EBPF_COLLECTION_INTERVAL and EBPF_DUMP_BPF_MAPS, which v3.2.0 does not read (config.collectionInterval, config.dumpBPFMaps)."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      versions: ["1.24-1.34"]
      tested: true
    linux:
      kernel:
        minimum: "5.10"
        recommended: "5.10+"
        note: "Full IPv4+IPv6 dual-stack support on kernel 5.10+"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse/blob/main/README.md
    - name: Architecture
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse/blob/main/docs/ARCHITECTURE.md
    - name: Source Code
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse
  artifacthub.io/images: |
    - name: kubeadapt-k8s-pulse
      image: public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-pulse:v3.2.0
