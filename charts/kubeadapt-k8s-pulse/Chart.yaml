      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse/blob/main/README.md
    - name: Architecture
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse/blob/main/docs/high-level-architecture.md
    - name: Source Code
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse
  artifacthub.io/images: |
    - name: kubeadapt-k8s-pulse
      image: public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-pulse:v3.2.0
