apiVersion: v2
name: kubeadapt-k8s-pulse
description: High-performance eBPF-based network metrics agent for Kubernetes
type: application
version: 1.1.0
appVersion: "3.0.1"

home: https://github.com/kubeadapt/kubeadapt-k8s-pulse
sources:
  - https://github.com/kubeadapt/kubeadapt-k8s-pulse

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - ebpf
  - network
  - monitoring
  - metrics
  - prometheus
  - observability
  - bandwidth
  - traffic
  - daemonset

# Additional metadata
annotations:
  # Oldest network monitor release this chart may run; the templates refuse an
  # older image.tag. It must be a release that attaches with TCX where the
  # kernel has it and, on older kernels, with a classic tc filter at its own
  # priority that never replaces another program's filter. v3.1.0 is the
  # newest release today and does not qualify (it replaces the filter at
  # priority 1, handle 1 on kernels older than 6.6), so the number below means
  # "any release after v3.1.0". When that release is cut, set this to its
  # version together with image.tag in values.yaml.
  kubeadapt.io/minimum-image-version: "3.1.1"
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: security
      description: "The network monitor no longer runs privileged or in the node's PID namespace. The container keeps the capabilities BPF, PERFMON, NET_ADMIN, SYS_RESOURCE and SYS_PTRACE and drops every other one, with no privilege escalation. privileged: true returns to a privileged container where a node policy denies the BPF operations."
    - kind: security
      description: "The chart refuses an image older than its minimum release (kubeadapt.io/minimum-image-version). Older images replace the tc filter that some CNI plugins and network policy agents keep on each pod interface, and network policy stops being enforced on the node."
    - kind: added
      description: "Export of each node's traffic records to the Kubeadapt agent with a bearer token (config.export), turned on by the kubeadapt chart."
    - kind: added
      description: "A ClusterRole with the read-only API access the network monitor uses: list and watch pods, get nodes, list ciliumenvoyconfigs (rbac.create)."
    - kind: changed
      description: "One pod on every Linux node, tainted nodes included, except AWS Fargate and virtual-kubelet nodes (nodeRequirements). Rollouts replace 25% of the pods at a time. Optional priority class (priorityClass, priorityClassName)."
    - kind: changed
      description: "Values written for an earlier release are refused at render. Upgrade with --reset-values -f <values file> or --reset-then-reuse-values."
    - kind: removed
      description: "config.collectionInterval and config.dumpBPFMaps, which the network monitor does not read, and the /sys and /sys/kernel/debug host mounts."
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      versions: ["1.24-1.35"]
      tested: true
    linux:
      kernel:
        minimum: "5.10"
        recommended: "5.10+"
        note: "Full IPv4+IPv6 dual-stack support on kernel 5.10+"
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse/blob/main/README.md
    - name: Architecture
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse/blob/main/docs/ARCHITECTURE.md
    - name: Source Code
      url: https://github.com/kubeadapt/kubeadapt-k8s-pulse
  artifacthub.io/images: |
    - name: kubeadapt-k8s-pulse
      image: public.ecr.aws/k2x0t8t6/kubeadapt/app/kubeadapt-k8s-pulse:v3.0.1
