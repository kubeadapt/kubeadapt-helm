apiVersion: v2
name: kubeadapt-k8s-pulse
description: High-performance eBPF-based network metrics agent for Kubernetes
type: application
version: 1.1.0
appVersion: "3.2.0"

home: https://github.com/kubeadapt/kubeadapt-k8s-pulse
sources:
  - https://github.com/kubeadapt/kubeadapt-k8s-pulse

maintainers:
  - name: "ugurcancaykara"
    email: "ugurcan@kubeadapt.io"
  - name: "Kubeadapt"
    email: "authors@kubeadapt.io"

keywords:
  - kubernetes
  - ebpf
  - network
  - monitoring
  - metrics
  - prometheus
  - observability
  - bandwidth
  - traffic
  - daemonset

# Additional metadata
annotations:
  artifacthub.io/signKey: |
    fingerprint: 3C8109B607AD3E119B7033D8948AD9EDA6BD626E
    url: https://kubeadapt.github.io/kubeadapt-helm/pgp_keys.asc
  artifacthub.io/changes: |
    - kind: added
      description: "Flow export to the Kubeadapt agent. Installed by the kubeadapt chart, pulse sends flows to that chart's agent Service and presents the agent's bearer token from a file (EBPF_AGENT_AUTH_TOKEN_FILE) mounted from the chart-generated Secret. The channel is plaintext gRPC: the token and the flows travel unencrypted inside the cluster network. Installed on its own, export stays off until config.export.agentEndpoint is set; config.export.tokenSecret names a Secret with the token."
    - kind: added
      description: "A read-only ClusterRole and ClusterRoleBinding (rbac.create): pods list/watch for the node-scoped pod identity informer, nodes get for this pod's own Node, and cilium.io ciliumenvoyconfigs list for the L7 detector. Before this the ServiceAccount had nothing bound, the pod informer never synced and flows carried no pod identity."
    - kind: fixed
      description: "dnsPolicy defaults to ClusterFirstWithHostNet. With hostNetwork and no dnsPolicy the pod used the node's resolver and could not resolve cluster Service names, including the agent endpoint."
    - kind: fixed
      description: "KUBEADAPT_MEMORY_LIMIT_BYTES is set from the container's memory limit. It is pulse's primary memory-limit source: with the host cgroup filesystem mounted, pulse cannot find its own memory.max."
    - kind: fixed
      description: "The node's CNI configuration (cniConfigDir, default /etc/cni/net.d) is mounted read-only at /host/etc/cni/net.d. Without it pulse could not measure the overlay's encapsulation overhead and bytes_wire understated overlay datapaths."
    - kind: changed
      description: "The default image is kubeadapt-k8s-pulse v3.2.0, the first release that sends the bearer token over plaintext gRPC and retries RESOURCE_EXHAUSTED (EBPF_RETRY_BUFFER_SIZE now takes effect)."
    - kind: removed
      description: "The EBPF_COLLECTION_INTERVAL, POD_NAME and POD_NAMESPACE variables and the config.collectionInterval value. No pulse code reads them."
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/platforms: |
    - eks
    - aks
    - gke
    - on-premise
  artifacthub.io/compatibility: |
    kubernetes:
      versions: ["1.24-1.35"]
      tested: true
    linux:
      kernel:
        minimum: "5.10"
        recommended: "5.10+"
        note: "Full IPv4+IPv6 dual-stack support on kernel 5.10+"
  artifacthub.io/links: |
